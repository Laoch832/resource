name: Android runtime verification
on:
  push:
    branches: [soundconnect-r1]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release containing the two candidate APKs
        required: true
        default: r1-test-1
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read candidates from Release when available
        id: release_input
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || 'r1-test-1' }}
        run: |
          mkdir -p apk
          if gh release download "$RELEASE_TAG" --pattern '*.apk' --dir apk; then
            echo 'source=release' >> "$GITHUB_OUTPUT"
          else
            echo 'source=branch' >> "$GITHUB_OUTPUT"
          fi
      - name: Read signed candidates from isolated input branch
        if: steps.release_input.outputs.source == 'branch'
        uses: actions/checkout@v4
        with:
          ref: soundconnect-r1-assets
          path: binary-input
      - name: Assemble and verify signed APKs
        if: steps.release_input.outputs.source == 'branch'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          base=Path('binary-input/ci-input');output=Path('apk');output.mkdir(exist_ok=True)
          for item in json.loads((base/'manifest.json').read_text()):
              path=output/item['file']
              with path.open('wb') as out:
                  for part in item['parts']:
                      out.write((base/part).read_bytes())
              assert path.stat().st_size==item['bytes']
              assert hashlib.sha256(path.read_bytes()).hexdigest()==item['sha256']
              print('SHA-256 verified:',path.name)
          PY
      - name: Verify Release checksums
        run: cd apk && sha256sum -c ../evidence/SHA256SUMS.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 runtime and installed NetEase entry tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 ci/android_runtime.py
      - name: Upload verified APKs to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || 'r1-test-1' }}
        run: |
          git archive --format=zip --output=R1-source.zip HEAD
          gh release upload "$RELEASE_TAG" apk/*.apk evidence/SHA256SUMS.txt R1-source.zip artifacts/runtime-report.json --clobber
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence
          path: artifacts/
