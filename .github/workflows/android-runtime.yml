name: Android runtime verification
on:
  push:
    branches: [soundconnect-r1]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release containing the two candidate APKs
        required: true
        default: r1-test-1
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || 'r1-test-1' }}
        run: |
          ready=0
          for attempt in $(seq 1 48); do
            count=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '[.assets[] | select(.state == "uploaded" and (.name | endswith(".apk")))] | length' 2>/dev/null || true)
            if [ "$count" = 2 ]; then ready=1; break; fi
            sleep 10
          done
          test "$ready" = 1
          gh release download "$RELEASE_TAG" --pattern '*.apk' --dir apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 11 runtime and installed NetEase entry tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 ci/android_runtime.py
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-evidence
          path: artifacts/
